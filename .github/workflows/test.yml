name: Tests

# Manual-only trigger to conserve GitHub Actions minutes during the alpha
# build sprint. Bobby 2026-04-29: 90% of 2000 free minutes consumed.
# To re-enable auto-runs once the rapid iteration slows down, restore the
# `push:` and `pull_request:` blocks.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Reduced matrix - was 3 OS x 2 Python = 6 runners per push.
        # Manual runs use ubuntu only; full matrix available on workflow_dispatch
        # with input override (enable below if needed).
        os: [ubuntu-latest]
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install [dev] for tooling + the feature extras whose tests run in CI.
          # End-users get the slim base; only CI pulls these heavier deps.
          pip install -e ".[dev,slides,figures,research,citations]"

      - name: Lint with ruff
        run: |
          ruff check src/ tests/
          ruff format --check src/ tests/

      - name: Type-check with mypy
        run: mypy src/vaultlab
        continue-on-error: true  # remove once strict mypy is clean

      - name: Run tests (skip LLM-hitting + matplotlib-requiring tests in CI)
        run: pytest -m "not llm and not slow" --tb=short
