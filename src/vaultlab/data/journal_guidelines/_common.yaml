# Cross-journal common rules (palette, accessibility, colorblind safety)
# Sources:
#   - Wong, B. Points of view: Color blindness. Nat Methods 8, 441 (2011).
#   - Crameri, F. Choosing Suitable Color Palettes... Current Protocols 4(8), e1126 (2024).
#   - Synthesis from Nature, Cell Press, Science figure guides
# Used by: vaultlab.figures.recipes (default palettes) + publication_guideline_compliance (audit checks)
last_fetched: 2026-05-08
schema_version: v0.1

palettes:
  categorical:
    okabe_ito:
      - "#000000"  # black
      - "#E69F00"  # orange
      - "#56B4E9"  # sky blue
      - "#009E73"  # bluish green
      - "#F0E442"  # yellow
      - "#0072B2"  # blue
      - "#D55E00"  # vermilion
      - "#CC79A7"  # reddish purple
    max_recommended_size: 8  # Okabe-Ito; group conceptually if more needed
    avoid:
      - red_green_combinations  # ~8% of men have red-green colorblindness
      - rainbow
      - jet
      - hsv
  sequential:
    default: viridis
    alternatives: [magma, plasma, inferno, cividis]
    properties:
      - perceptually_uniform
      - colorblind_safe
      - default_in_matplotlib
    avoid:
      - rainbow  # not perceptually uniform; artificial boundaries
      - jet
      - hsv

accessibility_rules:
  max_categorical_hues: 12
  redundant_shape_encoding_required_when_n_markers_ge: 4
  contrast_min_ratio: 4.5  # WCAG 2.1 AA standard
  text_on_busy_background: avoid

statistical_reporting_rules:  # cross-journal; stricter journals add their own on top
  sample_size_required: true
  test_disclosure_required: true
  multiple_testing_correction_required: true
  fdr_threshold_default: 0.05
  effect_size_required_for_inference: true  # not just p-value
  data_points_overlay_for_low_n: true  # n < 20

writing_conventions:
  hedged_voice_low_n_threshold: 10  # below this, "consistent with" not "demonstrates"
  citation_style_default: vancouver  # numbered; Cell-family default
  alternative_styles: [name_year]  # used by some Nature journals + most eLife
  abbreviation_rules:
    spell_out_on_first_use: true
    consistent_throughout_document: true
