[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "vaultlab"
version = "0.0.6"
description = "Claude Code setup for biological research — literature, knowledge base, data analysis, figures, and manuscripts in one workspace."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12,<3.14"
authors = [
    {name = "Bobby Y.X. Ni"},
]
maintainers = [
    {name = "Bobby Y.X. Ni"},
]
keywords = [
    "ai-lab", "scientific-computing", "spatial-omics", "codex", "maldi",
    "single-cell", "manuscript", "claude-code", "obsidian", "knowledge-base",
    "citation-verification", "figure-generation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Core (required for all subpackages) — kept small on purpose so a fresh
    # `pip install vaultlab` is fast (<60s) and small (<200MB). Heavier deps
    # live in optional extras below.
    "anthropic>=0.40",
    "pydantic>=2.6",
    "click>=8.1",
    "rich>=13.7",
    "pyyaml>=6.0",
    "platformdirs>=4.0",
    "httpx>=0.27",
    "tenacity>=8.2",
    "requests>=2.31",
    # Markdown loading + frontmatter
    "python-frontmatter>=1.1",
    "markdown-it-py>=3.0",
    # Light data deps — pandas/numpy are needed by most primitives + are
    # already cached in most data-science Python envs
    "numpy>=1.26",
    "pandas>=2.2",
]

[project.optional-dependencies]
research = [
    "biopython>=1.83",          # NCBI E-utilities
    "crossrefapi>=1.5",
    "semanticscholar>=0.7",
    "pdfplumber>=0.11",
    "pymupdf>=1.24",
]
semantic = [
    # Heavy: pulls in torch (~hundreds of MB). Only needed if you want
    # embeddings-based semantic search in the KB (vaultlab.kb.semantic_search).
    # The KB also supports keyword search without these — the recommendation
    # is to skip this extra unless you're at >500 KB docs and want fuzzy
    # search across them.
    "sentence-transformers>=3.0",
    "scikit-learn>=1.4",
]
citations = [
    "scikit-learn>=1.4",        # for cosine similarity helpers
]
kb = [
    "watchdog>=4.0",            # KB file watching
]
figures = [
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scikit-image>=0.23",
    "pillow>=10.2",
]
slides = [
    "python-pptx>=1.0",
    "Pillow>=10.2",
]
data-scrnaseq = [
    "scanpy>=1.10",
    "anndata>=0.10",
    "leidenalg>=0.10",
    "louvain>=0.8",
]
data-spatial = [
    "scanpy>=1.10",
    "squidpy>=1.5",
    "spatialdata>=0.1",
    "spatialdata-io>=0.1",
]
data-imaging = [
    "tifffile>=2024.1",
    "aicsimageio>=4.14",
    "opencv-python>=4.10",
    "cellpose>=3.0",
    "scikit-image>=0.23",
]
data-maldi = [
    "pyimzML>=1.5",
    # Cardinal-via-rpy2 is opt-in; install rpy2 manually if needed
]
data-flow = [
    "FlowCytometryTools>=0.5",
    "fcsparser>=0.2",
]
meetings = [
    # Source: https://github.com/bobbyni819/meeting-recorder
    # PyPI name differs from Python import name: install pulls
    # `vaultlab-meetings`, import is `meeting_recorder` (deliberate so
    # existing scripts that `import meeting_recorder` keep working).
    "vaultlab-meetings>=0.1; sys_platform == 'win32'",
]
stats = [
    "scipy>=1.13",
    "statsmodels>=0.14",
    "pingouin>=0.5",
]
manuscript = [
    "pypandoc>=1.13",
]
# Research-companion context (NEW for companion mode):
google = [
    "google-api-python-client>=2.140",
    "google-auth>=2.34",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
]
outlook-windows = [
    "pywin32>=306; sys_platform == 'win32'",
]
all = [
    "vaultlab[research,citations,kb,figures,slides,stats,manuscript,meetings,semantic]",
    "vaultlab[data-scrnaseq,data-spatial,data-imaging,data-maldi,data-flow]",
    "vaultlab[google,outlook-windows]",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "mypy>=1.10",
    "ruff>=0.15",  # pin to match CI; minor releases change format rules
    "pre-commit>=3.7",
]

[project.urls]
Homepage = "https://github.com/bobbyni819/vaultlab"
Repository = "https://github.com/bobbyni819/vaultlab"
Issues = "https://github.com/bobbyni819/vaultlab/issues"
Documentation = "https://github.com/bobbyni819/vaultlab#readme"

[project.scripts]
vaultlab = "vaultlab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vaultlab"]

[tool.hatch.build.targets.wheel.force-include]
".claude" = ".claude"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: integration tests that may use real APIs",
    "llm: tests that hit a real LLM API (excluded from default CI)",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_unreachable = true
files = ["src/vaultlab"]

[[tool.mypy.overrides]]
module = "vaultlab._internal.*"
strict_optional = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # comprehensions
    "UP",   # pyupgrade
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E402",   # module-import-not-at-top — lazy / circular-dep-avoiding imports are intentional
    "RUF001", # ambiguous-unicode-character-string — em-dashes / curly quotes are stylistic, intentional
    "RUF002", # ambiguous-unicode-character-docstring — same; pretty docstrings use em-dashes
    "RUF003", # ambiguous-unicode-character-comment
    "RUF005", # collection-literal-concatenation — tuple/list concat is sometimes clearer
    "RUF012", # mutable-class-default — false-positive on dataclass field(default_factory=) cases
    "RUF015", # unnecessary-iterable-allocation-for-first-element — minor; not worth churn
    "RUF022", # unsorted-dunder-all — order is often deliberate (logical grouping)
    "UP038",  # non-pep604-isinstance — pre-3.10 tuple form is fine
    "F841",   # unused-variable — sometimes intentional (debugging / future use)
    "B007",   # unused-loop-control-variable
    "F401",   # unused-import — barrel modules and lazy re-exports trip this
    "C408",   # unnecessary-collection-call — dict() vs {} is reader preference
    "C416",   # unnecessary-comprehension — sometimes the comprehension is clearer
    "RUF007", # zip-instead-of-pairwise — pairwise is 3.10+; zip works
    "RUF059", # unpacked-variable-never-used — destructuring is sometimes clearer than indexing
    "UP042",  # str-enum-double-inheritance — (str, Enum) inheritance is intentional for .value access
    "UP046",  # non-pep695-generic-class — PEP 695 syntax not universal yet
    "UP047",  # generic-function-without-type-params — PEP 695 not universal
]

[tool.ruff.format]
quote-style = "double"
