[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "vaultlab"
version = "0.0.1"
description = "From microscope to manuscript, in one repo. The AI lab for biological researchers."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12,<3.14"
authors = [
    {name = "Bobby Y.X. Ni"},
]
maintainers = [
    {name = "Bobby Y.X. Ni"},
]
keywords = [
    "ai-lab", "scientific-computing", "spatial-omics", "codex", "maldi",
    "single-cell", "manuscript", "claude-code", "obsidian", "knowledge-base",
    "citation-verification", "figure-generation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Core (required for all subpackages)
    "anthropic>=0.40",
    "pydantic>=2.6",
    "click>=8.1",
    "rich>=13.7",
    "pyyaml>=6.0",
    "platformdirs>=4.0",
    "httpx>=0.27",
    "tenacity>=8.2",
    # Markdown loading + frontmatter
    "python-frontmatter>=1.1",
    "markdown-it-py>=3.0",
    # Embeddings / semantic search (citations + KB)
    "sentence-transformers>=3.0",
    "numpy>=1.26",
    "pandas>=2.2",
]

[project.optional-dependencies]
research = [
    "biopython>=1.83",          # NCBI E-utilities
    "crossrefapi>=1.5",
    "semanticscholar>=0.7",
    "pdfplumber>=0.11",
    "pymupdf>=1.24",
]
citations = [
    "scikit-learn>=1.4",        # for cosine similarity helpers
]
kb = [
    "watchdog>=4.0",            # KB file watching
]
figures = [
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scikit-image>=0.23",
    "pillow>=10.2",
]
slides = [
    "python-pptx>=1.0",
    "Pillow>=10.2",
]
data-scrnaseq = [
    "scanpy>=1.10",
    "anndata>=0.10",
    "leidenalg>=0.10",
    "louvain>=0.8",
]
data-spatial = [
    "scanpy>=1.10",
    "squidpy>=1.5",
    "spatialdata>=0.1",
    "spatialdata-io>=0.1",
]
data-imaging = [
    "tifffile>=2024.1",
    "aicsimageio>=4.14",
    "opencv-python>=4.10",
    "cellpose>=3.0",
    "scikit-image>=0.23",
]
data-maldi = [
    "pyimzML>=1.5",
    # Cardinal-via-rpy2 is opt-in; install rpy2 manually if needed
]
data-flow = [
    "FlowCytometryTools>=0.5",
    "fcsparser>=0.2",
]
stats = [
    "scipy>=1.13",
    "statsmodels>=0.14",
    "pingouin>=0.5",
]
manuscript = [
    "pypandoc>=1.13",
]
all = [
    "vaultlab[research,citations,kb,figures,slides,stats,manuscript]",
    "vaultlab[data-scrnaseq,data-spatial,data-imaging,data-maldi,data-flow]",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "mypy>=1.10",
    "ruff>=0.4",
    "pre-commit>=3.7",
]

[project.urls]
Homepage = "https://github.com/bobbyni819/vaultlab"
Repository = "https://github.com/bobbyni819/vaultlab"
Issues = "https://github.com/bobbyni819/vaultlab/issues"
Documentation = "https://github.com/bobbyni819/vaultlab#readme"

[project.scripts]
vaultlab = "vaultlab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vaultlab"]

[tool.hatch.build.targets.wheel.force-include]
".claude" = ".claude"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: integration tests that may use real APIs",
    "llm: tests that hit a real LLM API (excluded from default CI)",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_unreachable = true
files = ["src/vaultlab"]

[[tool.mypy.overrides]]
module = "vaultlab._internal.*"
strict_optional = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # comprehensions
    "UP",   # pyupgrade
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
